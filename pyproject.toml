[project]
name = "prettyterm"
authors = [{ name = "Zhiyuan Ding", email = "zhiyuanding01@gmail.com" }]
version = "0.3.0"
description = "Pretty terminal utilities wrapped around rich: colorful progress bars, dict-to-table printing, and more."
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "rich>=13.0.0",
    "colorlog>=6.0.0",
]

[dependency-groups]
dev = [
    "mypy>=1.14,<1.19",
    "pytest>=8.3",
    "ruff>=0.9",
]

[tool.mypy]
python_version = "3.9"
follow_imports = "skip"
files = [
    "src/prettyterm/logger.py",
    "src/prettyterm/__init__.py",
    "tests",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py39"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
